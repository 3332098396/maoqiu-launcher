<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>毛球</title>
<!--
  开场动画（M17.4）

  【它是干什么的】主窗口"画好之前"先用这个盖着。
  【为什么要等一会儿才关】机器快的话主窗口几百毫秒就画好了，
  开场动画"啪"地闪一下反而像出了故障——所以关了要等够一个最短时间（在 main.js 里）。
  【为什么窗口是透明的】这样圆角和阴影才出得来；不透明的话就是个方角黑框。
-->
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    /* 关掉系统的文字选中/拖拽那套，动画期间别让人误操作 */
    user-select: none;
    -webkit-app-region: drag;
  }

  .card {
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    border-radius: 20px;
    background: linear-gradient(150deg, rgba(26, 31, 52, 0.97), rgba(12, 15, 26, 0.99));
    border: 1px solid rgba(138, 156, 214, 0.24);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55), 0 0 60px rgba(154, 92, 247, 0.18);
    animation: pop 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.25) both;
  }

  @keyframes pop {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }

  .logo {
    width: 96px;
    height: 96px;
    /* 像素风的图放大要用最近邻，不然糊成一团 */
    image-rendering: pixelated;
    filter: drop-shadow(0 10px 26px rgba(154, 92, 247, 0.55));
    animation: float 2.6s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }

  .name {
    font: 600 22px/1 "Microsoft YaHei", "PingFang SC", sans-serif;
    letter-spacing: 6px;
    /* 字距是加在字后面的，末尾会多出一格，往左挪回来才居中 */
    margin-left: 6px;
    color: #eaeefb;
  }

  .bar {
    width: 168px;
    height: 4px;
    border-radius: 99px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.09);
  }

  .bar i {
    display: block;
    width: 42%;
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, #9a5cf7, #2fd4e8);
    animation: slide 1.15s ease-in-out infinite;
  }

  @keyframes slide {
    0% { transform: translateX(-115%); }
    100% { transform: translateX(330%); }
  }

  .tip {
    font: 12px/1 "Microsoft YaHei", "PingFang SC", sans-serif;
    letter-spacing: 1px;
    color: #98a2c0;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="../../assets/app-256.png" alt="">
    <div class="name">毛球</div>
    <div class="bar"><i></i></div>
    <div class="tip">正在启动…</div>
  </div>
</body>
</html>
